name: Build Windows (32-bit)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --target i686-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: obrix-windows-x86
          path: |
            target/i686-pc-windows-msvc/release/bundle/msi/*.msi
            target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
